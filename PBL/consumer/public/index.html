<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orders Frontend</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; }
    input, button { padding: 8px; font-size: 14px; }
    #out { margin-top: 16px; padding: 12px; background: #f3f4f6; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Order Lookup</h2>
  <input id="oid" value="1001" /> <button onclick="lookup()">Find order</button>
  <div id="out">Result will appear here</div>
  <script src="../src/ordersClient.js"></script>
  <script>
    // Start the provider first: cd provider && npm start (port 8080)
    const client = new OrdersApp.OrdersClient('http://localhost:8080');
    async function lookup() {
      const out = document.getElementById('out');
      try {
        const order = await client.getOrder(document.getElementById('oid').value);
        out.textContent = order ? OrdersApp.formatOrderSummary(order) : 'Order not found';
      } catch (e) { out.textContent = 'Error: ' + e.message; }
    }
  </script>
</body>
</html>
